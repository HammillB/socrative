<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Test</title>
<style>
  :root {
    --ground: #f4f6f5; --card: #ffffff; --ink: #18211f; --muted: #5f6f6b;
    --line: #d5ded9; --accent: #0c6a5e; --accent-soft: #e3f0ec;
    --warn-bg: #fdf3e3; --warn-ink: #8a6508; --bad: #a8491a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 18px 140px; }

  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }

  /* ---- join ---- */
  .join { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 26px; max-width: 420px; margin: 40px auto; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 6px; }
  input {
    width: 100%; padding: 13px 14px; font-size: 19px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink);
  }
  input:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  #code { text-transform: uppercase; letter-spacing: 0.1em; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 7px;
    border: 1px solid transparent; padding: 13px 22px;
    background: var(--accent); color: #fff;
  }
  button:disabled { opacity: .55; cursor: default; }
  .join button { width: 100%; margin-top: 22px; font-size: 18px; }

  .error { color: var(--bad); font-weight: 600; margin-top: 14px; }

  /* ---- questions ---- */
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
       padding: 20px 22px; margin-bottom: 16px; }
  .q-head { display: flex; gap: 12px; align-items: baseline; margin-bottom: 14px; }
  .q-num { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .q-stem { font-size: 18px; }
  .q img, .choice img { max-width: 100%; border-radius: 6px; margin-top: 10px; display: block; }

  .choice {
    display: flex; gap: 13px; align-items: flex-start;
    padding: 13px 15px; margin-top: 9px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  .choice:hover { border-color: var(--accent); }
  .choice input { width: 21px; height: 21px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
  .choice.picked { background: var(--accent-soft); border-color: var(--accent); }
  .choice-letter { font-weight: 700; color: var(--muted); flex: none; min-width: 1.2em; }

  /* ---- status bar ---- */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
    border-top: 1px solid var(--line); padding: 12px 18px;
    display: flex; gap: 16px; align-items: center; justify-content: space-between;
  }
  .bar-inner { max-width: 760px; margin: 0 auto; width: 100%;
               display: flex; gap: 16px; align-items: center; justify-content: space-between; }
  .progress { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .offline { background: var(--warn-bg); color: var(--warn-ink); font-weight: 600;
             padding: 9px 18px; text-align: center; font-size: 15px; }

  .done { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 40px 26px; text-align: center; margin-top: 50px; }
  .score { font-size: 46px; font-weight: 700; color: var(--accent); margin: 14px 0 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="offline" class="offline" hidden>
  No connection — your answers are being saved on this device and will upload when it returns.
</div>

<div class="wrap">

  <!-- join ------------------------------------------------------------ -->
  <form id="join" class="join">
    <h1>Class Test</h1>
    <p class="sub">Enter the code on the board and your student number.</p>
    <label for="code">Class code</label>
    <input id="code" name="code" autocomplete="off" autocapitalize="characters"
           spellcheck="false" required>
    <label for="student">Student number</label>
    <input id="student" name="student" inputmode="numeric" autocomplete="off"
           spellcheck="false" required>
    <button type="submit">Start</button>
    <p id="join-error" class="error" hidden></p>
  </form>

  <!-- test ------------------------------------------------------------ -->
  <main id="test" hidden>
    <h1 id="title"></h1>
    <p class="sub" id="resumed" hidden>Welcome back — your answers are still here.</p>
    <div id="questions"></div>
  </main>

  <!-- done ------------------------------------------------------------ -->
  <section id="done" class="done" hidden>
    <h1>Handed in</h1>
    <p class="sub">You can close this page.</p>
    <div id="score-block" hidden>
      <div class="score" id="score"></div>
      <p class="sub" id="score-detail"></p>
    </div>
  </section>

</div>

<div id="bar" class="bar" hidden>
  <div class="bar-inner">
    <span class="progress" id="progress"></span>
    <button id="submit" type="button">Hand in</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const STORE = "classroom-test-attempt";

  let paper = null;         // { token, title, questions, answers }
  let pending = [];         // answers not yet accepted by the server
  let flushing = false;

  // --- local persistence ---------------------------------------------------
  // Every answer is written here the instant it is picked. The network is
  // treated as a nice-to-have; this is the source of truth until it syncs.

  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({ paper, pending }));
    } catch { /* private mode, full disk: carry on, the server still has it */ }
  }

  function restore() {
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return false;
      const saved = JSON.parse(raw);
      if (!saved?.paper?.token) return false;
      paper = saved.paper;
      pending = saved.pending || [];
      return true;
    } catch { return false; }
  }

  function clearStore() {
    try { localStorage.removeItem(STORE); } catch {}
  }

  // --- network -------------------------------------------------------------

  async function post(path, body) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    return data;
  }

  function setOffline(isOffline) {
    $("offline").hidden = !isOffline;
  }

  /** Send queued answers, oldest first. Anything that fails stays queued. */
  async function flush() {
    if (flushing || !pending.length) return;
    flushing = true;
    try {
      while (pending.length) {
        const next = pending[0];
        await post("/api/answer", { token: paper.token, ...next });
        pending.shift();
        save();
      }
      setOffline(false);
    } catch {
      setOffline(true);
    } finally {
      flushing = false;
    }
  }

  setInterval(flush, 4000);
  window.addEventListener("online", flush);
  window.addEventListener("offline", () => setOffline(true));

  // --- rendering -----------------------------------------------------------

  /**
   * Fetch every image before the first question appears.
   *
   * Without this, offline tolerance is only half true: a student keeps their
   * answers through a dropped connection but stares at a broken diagram.
   */
  function preloadImages(questions) {
    const urls = [];
    for (const q of questions) {
      if (q.media) urls.push(q.media);
      for (const c of q.choices) if (c.media) urls.push(c.media);
    }
    return Promise.all(urls.map((url) => new Promise((done) => {
      const img = new Image();
      img.onload = img.onerror = done;
      img.src = url;
    })));
  }

  function render() {
    $("title").textContent = paper.title;
    $("resumed").hidden = !paper.resumed;

    const host = $("questions");
    host.textContent = "";

    paper.questions.forEach((question, index) => {
      const card = document.createElement("section");
      card.className = "q";

      const head = document.createElement("div");
      head.className = "q-head";
      const num = document.createElement("span");
      num.className = "q-num";
      num.textContent = index + 1 + ".";
      const stem = document.createElement("span");
      stem.className = "q-stem";
      stem.textContent = question.stem;
      head.append(num, stem);
      card.append(head);

      if (question.media) {
        const img = document.createElement("img");
        img.src = question.media;
        img.alt = "";
        card.append(img);
      }

      question.choices.forEach((choice, ci) => {
        const label = document.createElement("label");
        label.className = "choice";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "q" + question.id;
        radio.value = choice.id;
        radio.checked = paper.answers[question.id] === choice.id;
        if (radio.checked) label.classList.add("picked");

        const letter = document.createElement("span");
        letter.className = "choice-letter";
        letter.textContent = "ABCDEFGH"[ci];

        const text = document.createElement("span");
        text.textContent = choice.text;

        radio.addEventListener("change", () => choose(question.id, choice.id));

        label.append(radio, letter, text);
        if (choice.media) {
          const img = document.createElement("img");
          img.src = choice.media;
          img.alt = "";
          label.append(img);
        }
        card.append(label);
      });

      host.append(card);
    });

    updateProgress();
  }

  function choose(questionId, choiceId) {
    paper.answers[questionId] = choiceId;
    pending.push({ questionId, choiceId });
    save();

    for (const label of document.querySelectorAll(".choice")) {
      label.classList.toggle("picked", label.querySelector("input").checked);
    }
    updateProgress();
    flush();
  }

  function updateProgress() {
    const total = paper.questions.length;
    const answered = paper.questions.filter((q) => paper.answers[q.id] != null).length;
    $("progress").textContent = `${answered} of ${total} answered`;
    $("submit").textContent = answered < total ? "Hand in early" : "Hand in";
  }

  // --- flow ----------------------------------------------------------------

  async function start(data) {
    paper = { ...data, answers: data.answers || {} };
    pending = [];
    save();
    await preloadImages(paper.questions);
    $("join").hidden = true;
    $("test").hidden = false;
    $("bar").hidden = false;
    render();
  }

  $("join").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = event.target.querySelector("button");
    const error = $("join-error");
    error.hidden = true;
    button.disabled = true;
    button.textContent = "Starting…";
    try {
      const data = await post("/api/join", {
        code: $("code").value.trim().toUpperCase(),
        studentNumber: $("student").value.trim(),
      });
      await start(data);
    } catch (err) {
      error.textContent = err.message;
      error.hidden = false;
    } finally {
      button.disabled = false;
      button.textContent = "Start";
    }
  });

  $("submit").addEventListener("click", async () => {
    const total = paper.questions.length;
    const answered = paper.questions.filter((q) => paper.answers[q.id] != null).length;
    const missing = total - answered;
    const warning = missing
      ? `You have ${missing} question${missing === 1 ? "" : "s"} unanswered. Hand in anyway?`
      : "Hand your test in? You will not be able to change your answers.";
    if (!confirm(warning)) return;

    $("submit").disabled = true;
    await flush();
    if (pending.length) {
      alert("Some answers have not uploaded yet. Stay on this page until the warning clears, then try again.");
      $("submit").disabled = false;
      return;
    }
    try {
      const { score } = await post("/api/submit", { token: paper.token });
      clearStore();
      $("test").hidden = true;
      $("bar").hidden = true;
      $("done").hidden = false;
      if (score && score.showToStudent) {
        $("score").textContent = score.percent + "%";
        $("score-detail").textContent = `${score.correct} of ${score.questions} correct`;
        $("score-block").hidden = false;
      }
    } catch (err) {
      alert(err.message);
      $("submit").disabled = false;
    }
  });

  // Log losing focus. Not lockdown -- a browser tab cannot be locked down --
  // but it is a signal worth having when a score looks surprising.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && paper) {
      navigator.sendBeacon?.(
        "/api/event",
        new Blob([JSON.stringify({ token: paper.token, kind: "focus_lost" })],
                 { type: "application/json" })
      );
    }
  });

  // A reload mid-test picks straight back up.
  if (restore()) {
    $("join").hidden = true;
    $("test").hidden = false;
    $("bar").hidden = false;
    preloadImages(paper.questions).then(render);
    flush();
  }
})();
</script>
</body>
</html>
