<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Test</title>
<style>
  :root {
    --ground: #f4f6f5; --card: #ffffff; --ink: #18211f; --muted: #5f6f6b;
    --line: #d5ded9; --accent: #0c6a5e; --accent-soft: #e3f0ec;
    --warn-bg: #fdf3e3; --warn-ink: #8a6508; --bad: #a8491a;
    --right: #10715f; --right-bg: #d9ece6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 18px 40px; }

  h1 { font-size: 25px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 22px; }

  /* ---- join ---- */
  .join { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 26px; max-width: 420px; margin: 40px auto; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 6px; }
  input[type=text] {
    width: 100%; padding: 13px 14px; font-size: 19px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink);
  }
  input:focus-visible, button:focus-visible, .choice:focus-within {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  #code { text-transform: uppercase; letter-spacing: 0.1em; }
  button {
    font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
    border-radius: 7px; border: 1px solid transparent; padding: 13px 24px;
    background: var(--accent); color: #fff;
  }
  button.quiet { background: var(--card); color: var(--ink); border-color: var(--line); }
  button:disabled { opacity: .4; cursor: default; }
  .join button { width: 100%; margin-top: 22px; font-size: 18px; }
  .error { color: var(--bad); font-weight: 600; margin-top: 14px; }

  /* ---- progress ---- */
  .meta { display: flex; justify-content: space-between; align-items: baseline;
          margin-bottom: 10px; gap: 12px; }
  .counter { font-weight: 700; font-size: 15px; letter-spacing: .02em; }
  .title { color: var(--muted); font-size: 15px; }
  .track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden;
           margin-bottom: 22px; }
  .fill { height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }

  /* ---- question ---- */
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
       padding: 26px; }
  .stem { font-size: 20px; line-height: 1.45; margin: 0 0 6px; }
  .q img { max-width: 100%; border-radius: 6px; margin-top: 14px; display: block; }

  .choice {
    display: flex; gap: 13px; align-items: flex-start;
    padding: 15px 16px; margin-top: 10px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  .choice:hover { border-color: var(--accent); }
  .choice input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--accent); }
  .choice.picked { background: var(--accent-soft); border-color: var(--accent); }
  .choice-letter { font-weight: 700; color: var(--muted); flex: none; min-width: 1.2em; }
  .choice img { max-width: 100%; border-radius: 6px; margin-top: 8px; display: block; }

  .choice.graded { cursor: default; }
  .choice.graded:hover { border-color: var(--line); }
  .choice.is-correct { background: var(--right-bg); border-color: var(--right); }
  .choice.is-wrong   { background: #f7e2d7; border-color: var(--bad); }
  .choice .tag { margin-left: auto; font-size: 13px; font-weight: 700;
                 letter-spacing: .04em; text-transform: uppercase; }
  .choice.is-correct .tag { color: var(--right); }
  .choice.is-wrong .tag   { color: var(--bad); }

  .actions { margin-top: 26px; display: flex; gap: 12px; align-items: center;
             flex-wrap: wrap; }
  .actions .spacer { flex: 1 1 auto; }
  .final-note { color: var(--muted); font-size: 14.5px; }

  .offline { background: var(--warn-bg); color: var(--warn-ink); font-weight: 600;
             padding: 10px 18px; text-align: center; font-size: 15px; }

  .feedback { margin-top: 20px; padding: 16px 20px; border-radius: 8px; font-size: 16.5px;
              line-height: 1.5; }
  .feedback.yes { background: var(--right-bg); color: var(--right); }
  .feedback.no  { background: #f7e2d7; color: var(--bad); }
  .feedback .verdict { display: block; font-weight: 700; font-size: 18px; margin-bottom: 4px; }
  .feedback .why { display: block; margin-top: 8px; color: var(--ink); }

  /* ---- unanswered prompt ---- */
  .prompt { margin-top: 20px; padding: 16px 20px; border-radius: 8px;
            background: var(--warn-bg); color: var(--warn-ink); font-size: 16.5px; }
  .prompt strong { display: block; margin-bottom: 4px; font-size: 17px; }
  .prompt button { margin-top: 12px; font-size: 16px; padding: 10px 18px; }

  .done { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 46px 26px; text-align: center; margin-top: 50px; }
  .score { font-size: 46px; font-weight: 700; color: var(--accent); margin: 14px 0 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="offline" class="offline" hidden>
  No connection. Your work is saved on this device and will upload when it returns.
</div>

<div class="wrap">

  <!-- join ------------------------------------------------------------- -->
  <form id="join" class="join">
    <h1>Class Test</h1>
    <p class="sub">Enter your room name and your student number.</p>
    <label for="code">Room name</label>
    <input type="text" id="code" autocomplete="off" autocapitalize="characters"
           spellcheck="false" required>
    <label for="student">Student number</label>
    <input type="text" id="student" inputmode="numeric" autocomplete="off"
           spellcheck="false" required>
    <button type="submit">Start</button>
    <p id="join-error" class="error" hidden></p>
  </form>

  <!-- one question at a time ------------------------------------------- -->
  <main id="test" hidden>
    <div class="meta">
      <span class="counter" id="counter"></span>
      <span class="title" id="title"></span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>

    <section class="q">
      <p class="stem" id="stem"></p>
      <div id="stem-media"></div>
      <div id="choices"></div>
      <div class="feedback" id="feedback" hidden></div>

      <div class="actions" id="actions"></div>

      <div class="prompt" id="prompt" hidden></div>
      <p id="q-error" class="error" hidden></p>
    </section>
  </main>

  <!-- finished --------------------------------------------------------- -->
  <section id="done" class="done" hidden>
    <h1>All done</h1>
    <p class="sub">Your test has been handed in. You can close this page.</p>
    <div id="score-block" hidden>
      <div class="score" id="score"></div>
      <p class="sub" id="score-detail"></p>
    </div>
  </section>

</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const STORE = "classroom-test-token";
  const LETTERS = "ABCDEFGH";

  let state = null;       // whatever the server last told us
  let index = 0;          // open mode: which question is on screen
  let picked = null;      // sequential mode: chosen but not yet submitted
  let pendingNext = null; // sequential mode: next question, held behind feedback
  let sending = false;
  let queue = [];         // open mode: answers not yet accepted by the server

  const isOpen = () => state?.delivery === "open";

  /**
   * Name the unanswered questions without listing twenty of them. A student
   * who missed two wants to know which two; one who has barely started wants
   * a count and somewhere to go.
   */
  function describeUnanswered(numbers) {
    if (numbers.length === 1) return `You still need to answer question ${numbers[0]}.`;
    if (numbers.length <= 6) {
      return `You still need to answer questions ${numbers.slice(0, -1).join(", ")}` +
             ` and ${numbers[numbers.length - 1]}.`;
    }
    return `You still have ${numbers.length} questions to answer.` +
           ` The first is question ${numbers[0]}.`;
  }

  // --- network -------------------------------------------------------------

  async function post(path, body) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(data.error || "Something went wrong."); e.status = res.status; e.data = data; throw e; }
    return data;
  }

  const setOffline = (yes) => { $("offline").hidden = !yes; };

  function saveLocal() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        token: state.token, answers: state?.answers ?? null, queue, index,
      }));
    } catch { /* private mode or full disk: the server still has it */ }
  }

  /**
   * Open mode only: push queued answers, oldest first.
   *
   * Because the whole paper is already in the browser, a student can keep
   * working through a dropout and everything syncs when the network returns.
   */
  async function flush() {
    if (!queue.length || sending) return;
    sending = true;
    try {
      while (queue.length) {
        await post("/api/answer", { token: state.token, ...queue[0] });
        queue.shift();
        saveLocal();
      }
      setOffline(false);
    } catch {
      setOffline(true);
    } finally {
      sending = false;
    }
  }
  setInterval(() => { if (isOpen()) flush(); }, 4000);
  window.addEventListener("online", () => { if (isOpen()) flush(); });
  window.addEventListener("offline", () => { if (isOpen()) setOffline(true); });

  // --- rendering -----------------------------------------------------------

  function makeButton(text, { quiet = false, disabled = false, onClick } = {}) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = text;
    if (quiet) b.className = "quiet";
    b.disabled = disabled;
    if (onClick) b.addEventListener("click", onClick);
    return b;
  }

  function renderChoices(question, selectedId, { locked = false } = {}) {
    const host = $("choices");
    host.textContent = "";

    question.choices.forEach((choice, i) => {
      const label = document.createElement("label");
      label.className = "choice";

      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "answer";
      radio.value = choice.id;
      radio.checked = String(selectedId) === String(choice.id);
      radio.disabled = locked;
      if (radio.checked) label.classList.add("picked");

      const letter = document.createElement("span");
      letter.className = "choice-letter";
      letter.textContent = LETTERS[i];

      const text = document.createElement("span");
      text.textContent = choice.text;

      radio.addEventListener("change", () => onPick(question, choice.id));

      label.append(radio, letter, text);
      if (choice.media) {
        const img = document.createElement("img");
        img.src = choice.media; img.alt = "";
        label.append(img);
      }
      host.append(label);
    });
  }

  function renderStem(question) {
    $("stem").textContent = question.stem;
    const media = $("stem-media");
    media.textContent = "";
    if (question.media) {
      const img = document.createElement("img");
      img.src = question.media; img.alt = "";
      media.append(img);
    }
  }

  // --- open navigation -----------------------------------------------------

  function renderOpen() {
    const question = state.paper[index];
    const answeredCount = Object.keys(state.answers).length;

    $("title").textContent = state.title;
    $("counter").textContent = `Question ${index + 1} of ${state.total}`;
    $("fill").style.width = (answeredCount / state.total * 100) + "%";
    $("feedback").hidden = true;
    $("q-error").hidden = true;

    renderStem(question);
    renderChoices(question, state.answers[question.id]);

    const actions = $("actions");
    actions.textContent = "";
    actions.append(
      makeButton("Back", {
        quiet: true, disabled: index === 0,
        onClick: () => { index--; saveLocal(); renderOpen(); },
      }),
      makeButton("Next", {
        quiet: true, disabled: index >= state.total - 1,
        onClick: () => { index++; saveLocal(); renderOpen(); },
      }),
    );

    const spacer = document.createElement("span");
    spacer.className = "spacer";
    actions.append(spacer);

    const note = document.createElement("span");
    note.className = "final-note";
    note.textContent = `${answeredCount} of ${state.total} answered`;
    actions.append(note, makeButton("Hand in", { onClick: handIn }));

    window.scrollTo({ top: 0, behavior: "instant" });
  }

  /** Blank questions block handing in, and the prompt says which and where. */
  function showUnanswered(message, unanswered) {
    const box = $("prompt");
    box.textContent = "";
    box.hidden = false;

    const head = document.createElement("strong");
    head.textContent = "Not finished yet";
    box.append(head, document.createTextNode(message));

    if (unanswered?.length) {
      box.append(makeButton(`Go to question ${unanswered[0]}`, {
        onClick: () => {
          index = unanswered[0] - 1;
          box.hidden = true;
          saveLocal();
          renderOpen();
        },
      }));
    }
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  async function handIn() {
    $("prompt").hidden = true;

    // Check here first so a student with a dropped connection still gets a
    // useful answer instead of a network error.
    const missing = state.paper
      .map((q, i) => (state.answers[q.id] == null ? i + 1 : null))
      .filter((n) => n !== null);

    if (missing.length) {
      showUnanswered(describeUnanswered(missing), missing);
      return;
    }

    await flush();
    if (queue.length) {
      $("q-error").textContent =
        "Some answers have not uploaded yet. Wait for the warning to clear, then try again.";
      $("q-error").hidden = false;
      return;
    }

    try {
      const data = await post("/api/submit", { token: state.token });
      clearLocal();
      showDone(data.score);
    } catch (err) {
      if (err.status === 409 && err.data?.unanswered) {
        showUnanswered(err.message, err.data.unanswered);
      } else {
        $("q-error").textContent = err.message;
        $("q-error").hidden = false;
      }
    }
  }

  function onPick(question, choiceId) {
    if (isOpen()) {
      state.answers[question.id] = choiceId;
      queue = queue.filter((q) => q.questionId !== question.id);
      queue.push({ questionId: question.id, choiceId });
      saveLocal();
      $("prompt").hidden = true;
      renderOpen();
      flush();
    } else {
      picked = choiceId;
      $("submit-btn").disabled = false;
      for (const el of document.querySelectorAll(".choice")) {
        el.classList.toggle("picked", el.querySelector("input").checked);
      }
    }
  }

  // --- sequential ----------------------------------------------------------

  function renderSequential() {
    picked = null;
    pendingNext = null;

    $("title").textContent = state.title;
    $("counter").textContent = `Question ${state.number} of ${state.total}`;
    $("fill").style.width = ((state.number - 1) / state.total * 100) + "%";
    $("feedback").hidden = true;
    $("prompt").hidden = true;
    $("q-error").hidden = true;

    renderStem(state.question);
    renderChoices(state.question, null);

    const actions = $("actions");
    actions.textContent = "";
    const submit = makeButton("Submit answer", { disabled: true, onClick: onSequentialButton });
    submit.id = "submit-btn";
    const note = document.createElement("span");
    note.className = "final-note";
    note.id = "final-note";
    note.textContent = "This answer is final — you cannot come back to it.";
    actions.append(submit, note);

    window.scrollTo({ top: 0, behavior: "instant" });
  }

  function onSequentialButton() {
    if (pendingNext) {
      const next = pendingNext;
      pendingNext = null;
      apply(next);
    } else {
      submitSequential();
    }
  }

  function showFeedback(feedback, next) {
    pendingNext = next;

    for (const label of document.querySelectorAll(".choice")) {
      const radio = label.querySelector("input");
      radio.disabled = true;
      label.classList.add("graded");
      label.classList.remove("picked");

      const letter = label.querySelector(".choice-letter").textContent;
      if (radio.checked) {
        label.classList.add(feedback.correct ? "is-correct" : "is-wrong");
        label.append(tag("Your answer"));
      } else if (!feedback.correct && letter === feedback.correctLetter) {
        label.classList.add("is-correct");
        label.append(tag("Correct answer"));
      }
    }

    const box = $("feedback");
    box.textContent = "";
    box.hidden = false;
    box.className = "feedback " + (feedback.correct ? "yes" : "no");

    const verdict = document.createElement("strong");
    verdict.className = "verdict";
    verdict.textContent = feedback.correct ? "Correct" : "Incorrect";
    box.append(verdict);

    if (!feedback.correct && feedback.correctText) {
      box.append(document.createTextNode(
        `The correct answer is ${feedback.correctLetter}. ${feedback.correctText}`
      ));
    }
    if (feedback.explanation) {
      const why = document.createElement("span");
      why.className = "why";
      why.textContent = feedback.explanation;
      box.append(why);
    }

    const button = $("submit-btn");
    button.disabled = false;
    button.textContent = next.finished ? "Finish" : "Next question";
    $("final-note").hidden = true;
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function tag(text) {
    const span = document.createElement("span");
    span.className = "tag";
    span.textContent = text;
    return span;
  }

  /**
   * The answer is not recorded until the server has it, and the next question
   * only arrives in that same reply. A failed send must therefore not advance
   * anything: the student stays put with their choice still selected. If the
   * device dies here the question is simply unanswered, and they get it again.
   */
  async function submitSequential() {
    if (picked == null || sending) return;
    sending = true;
    const button = $("submit-btn");
    button.disabled = true;
    button.textContent = "Sending…";
    $("q-error").hidden = true;

    for (let attempt = 0; attempt < 4; attempt++) {
      try {
        const data = await post("/api/answer", {
          token: state.token, questionId: state.question.id, choiceId: picked,
        });
        setOffline(false);
        sending = false;
        if (data.feedback) showFeedback(data.feedback, data);
        else apply(data);
        return;
      } catch (err) {
        if (err.status && err.status < 500) {
          sending = false;
          $("q-error").textContent = err.message;
          $("q-error").hidden = false;
          button.disabled = false;
          button.textContent = "Submit answer";
          return;
        }
        setOffline(true);
        await new Promise((r) => setTimeout(r, 1000 * (attempt + 1)));
      }
    }

    sending = false;
    button.disabled = false;
    button.textContent = "Try again";
    $("q-error").textContent = "Could not reach the server. Your answer has not been saved yet.";
    $("q-error").hidden = false;
  }

  // --- flow ----------------------------------------------------------------

  function showDone(score) {
    $("test").hidden = true;
    $("done").hidden = false;
    if (score && score.showToStudent) {
      $("score").textContent = score.percent + "%";
      $("score-detail").textContent = `${score.correct} of ${score.questions} correct`;
      $("score-block").hidden = false;
    }
  }

  function clearLocal() {
    try { localStorage.removeItem(STORE); } catch {}
  }

  function apply(data) {
    state = data;
    $("join").hidden = true;

    if (data.finished) { clearLocal(); showDone(data.score); return; }

    $("test").hidden = false;
    if (isOpen()) {
      state.answers = state.answers ?? {};
      index = Math.min(Math.max(index, 0), state.total - 1);
      saveLocal();
      renderOpen();
    } else {
      try { localStorage.setItem(STORE, JSON.stringify({ token: data.token })); } catch {}
      renderSequential();
    }
  }

  $("join").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = event.target.querySelector("button");
    const error = $("join-error");
    error.hidden = true;
    button.disabled = true;
    button.textContent = "Starting…";
    try {
      index = 0;
      queue = [];
      apply(await post("/api/join", {
        room: $("code").value.trim(),
        studentNumber: $("student").value.trim(),
      }));
    } catch (err) {
      error.textContent = err.message;
      error.hidden = false;
    } finally {
      button.disabled = false;
      button.textContent = "Start";
    }
  });

  // Log losing focus. Not lockdown -- a browser tab cannot be locked down --
  // but it is a signal worth having when a score looks surprising.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state?.token) {
      navigator.sendBeacon?.(
        "/api/event",
        new Blob([JSON.stringify({ token: state.token, kind: "focus_lost" })],
                 { type: "application/json" })
      );
    }
  });

  // A reload, or a new device, resumes from the server. Anything still queued
  // on this device is replayed on top.
  (async () => {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE) || "null"); } catch {}
    if (!saved?.token) return;
    try {
      const fresh = await post("/api/resume", { token: saved.token });
      queue = saved.queue ?? [];
      index = saved.index ?? 0;
      apply(fresh);
      if (isOpen()) {
        for (const q of queue) state.answers[q.questionId] = q.choiceId;
        renderOpen();
        flush();
      }
    } catch {
      clearLocal();   // finished, closed, or stale
    }
  })();
})();
</script>
</body>
</html>
