<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Test</title>
<style>
  :root {
    --ground: #f4f6f5; --card: #ffffff; --ink: #18211f; --muted: #5f6f6b;
    --line: #d5ded9; --accent: #0c6a5e; --accent-soft: #e3f0ec;
    --warn-bg: #fdf3e3; --warn-ink: #8a6508; --bad: #a8491a;
    --right: #10715f; --right-bg: #d9ece6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 18px 40px; }

  h1 { font-size: 25px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 22px; }

  /* ---- join ---- */
  .join { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 26px; max-width: 420px; margin: 40px auto; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 6px; }
  input[type=text] {
    width: 100%; padding: 13px 14px; font-size: 19px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink);
  }
  input:focus-visible, button:focus-visible, .choice:focus-within {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  #code { text-transform: uppercase; letter-spacing: 0.1em; }
  button {
    font: inherit; font-size: 18px; font-weight: 600; cursor: pointer;
    border-radius: 7px; border: 1px solid transparent; padding: 14px 26px;
    background: var(--accent); color: #fff;
  }
  button:disabled { opacity: .45; cursor: default; }
  .join button { width: 100%; margin-top: 22px; }
  .error { color: var(--bad); font-weight: 600; margin-top: 14px; }

  /* ---- progress ---- */
  .meta { display: flex; justify-content: space-between; align-items: baseline;
          margin-bottom: 10px; }
  .counter { font-weight: 700; font-size: 15px; letter-spacing: .02em; }
  .title { color: var(--muted); font-size: 15px; }
  .track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden;
           margin-bottom: 22px; }
  .fill { height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }

  /* ---- question ---- */
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
       padding: 26px; }
  .stem { font-size: 20px; line-height: 1.45; margin: 0 0 6px; }
  .q img { max-width: 100%; border-radius: 6px; margin-top: 14px; display: block; }

  .choice {
    display: flex; gap: 13px; align-items: flex-start;
    padding: 15px 16px; margin-top: 10px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  .choice:hover { border-color: var(--accent); }
  .choice input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--accent); }
  .choice.picked { background: var(--accent-soft); border-color: var(--accent); }
  .choice-letter { font-weight: 700; color: var(--muted); flex: none; min-width: 1.2em; }
  .choice img { max-width: 100%; border-radius: 6px; margin-top: 8px; display: block; }

  .actions { margin-top: 26px; display: flex; gap: 16px; align-items: center;
             flex-wrap: wrap; }
  .final-note { color: var(--muted); font-size: 14.5px; }

  .offline { background: var(--warn-bg); color: var(--warn-ink); font-weight: 600;
             padding: 10px 18px; text-align: center; font-size: 15px; }

  .choice.graded { cursor: default; }
  .choice.graded:hover { border-color: var(--line); }
  .choice.is-correct { background: var(--right-bg); border-color: var(--right); }
  .choice.is-wrong   { background: #f7e2d7; border-color: var(--bad); }
  .choice .tag { margin-left: auto; font-size: 13px; font-weight: 700;
                 letter-spacing: .04em; text-transform: uppercase; }
  .choice.is-correct .tag { color: var(--right); }
  .choice.is-wrong .tag   { color: var(--bad); }

  .feedback { margin-top: 20px; padding: 16px 20px; border-radius: 8px; font-size: 16.5px;
              line-height: 1.5; }
  .feedback.yes { background: var(--right-bg); color: var(--right); }
  .feedback.no  { background: #f7e2d7; color: var(--bad); }
  .feedback .verdict { display: block; font-weight: 700; font-size: 18px; margin-bottom: 4px; }
  .feedback .why { display: block; margin-top: 8px; color: var(--ink); }

  .done { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 46px 26px; text-align: center; margin-top: 50px; }
  .score { font-size: 46px; font-weight: 700; color: var(--accent); margin: 14px 0 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="offline" class="offline" hidden>
  No connection. Your answer has not been sent yet — stay on this page, it will
  keep trying.
</div>

<div class="wrap">

  <!-- join ------------------------------------------------------------- -->
  <form id="join" class="join">
    <h1>Class Test</h1>
    <p class="sub">Enter the code on the board and your student number.</p>
    <label for="code">Class code</label>
    <input type="text" id="code" autocomplete="off" autocapitalize="characters"
           spellcheck="false" required>
    <label for="student">Student number</label>
    <input type="text" id="student" inputmode="numeric" autocomplete="off"
           spellcheck="false" required>
    <button type="submit">Start</button>
    <p id="join-error" class="error" hidden></p>
  </form>

  <!-- one question ----------------------------------------------------- -->
  <main id="test" hidden>
    <div class="meta">
      <span class="counter" id="counter"></span>
      <span class="title" id="title"></span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>

    <section class="q">
      <p class="stem" id="stem"></p>
      <div id="stem-media"></div>
      <div id="choices"></div>
      <div class="feedback" id="feedback" hidden></div>
      <div class="actions">
        <button id="submit" type="button" disabled>Submit answer</button>
        <span class="final-note">This answer is final — you cannot come back to it.</span>
      </div>
      <p id="q-error" class="error" hidden></p>
    </section>
  </main>

  <!-- finished --------------------------------------------------------- -->
  <section id="done" class="done" hidden>
    <h1>All done</h1>
    <p class="sub">You have answered every question. You can close this page.</p>
    <div id="score-block" hidden>
      <div class="score" id="score"></div>
      <p class="sub" id="score-detail"></p>
    </div>
  </section>

</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const STORE = "classroom-test-token";
  const LETTERS = "ABCDEFGH";

  let state = null;      // { token, title, total, number, question, finished }
  let picked = null;     // choice id selected but not yet submitted
  let sending = false;
  let pendingNext = null; // next question, held while feedback is on screen

  // --- network -------------------------------------------------------------

  async function post(path, body) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(data.error || "Something went wrong."); e.status = res.status; throw e; }
    return data;
  }

  const setOffline = (yes) => { $("offline").hidden = !yes; };

  // --- rendering -----------------------------------------------------------

  function showQuestion() {
    picked = null;
    pendingNext = null;
    $("submit").disabled = true;
    $("submit").textContent = "Submit answer";
    $("q-error").hidden = true;
    $("feedback").hidden = true;
    document.querySelector(".final-note").hidden = false;

    $("title").textContent = state.title;
    $("counter").textContent = `Question ${state.number} of ${state.total}`;
    $("fill").style.width = ((state.number - 1) / state.total * 100) + "%";

    const question = state.question;
    $("stem").textContent = question.stem;

    const media = $("stem-media");
    media.textContent = "";
    if (question.media) {
      const img = document.createElement("img");
      img.src = question.media; img.alt = "";
      media.append(img);
    }

    const host = $("choices");
    host.textContent = "";
    question.choices.forEach((choice, index) => {
      const label = document.createElement("label");
      label.className = "choice";

      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "answer";
      radio.value = choice.id;

      const letter = document.createElement("span");
      letter.className = "choice-letter";
      letter.textContent = LETTERS[index];

      const text = document.createElement("span");
      text.textContent = choice.text;

      radio.addEventListener("change", () => {
        picked = choice.id;
        $("submit").disabled = false;
        for (const el of document.querySelectorAll(".choice")) {
          el.classList.toggle("picked", el.querySelector("input").checked);
        }
      });

      label.append(radio, letter, text);
      if (choice.media) {
        const img = document.createElement("img");
        img.src = choice.media; img.alt = "";
        label.append(img);
      }
      host.append(label);
    });

    window.scrollTo({ top: 0, behavior: "instant" });
  }

  /**
   * Freeze the question and show how it went.
   *
   * The next question has already arrived but is held back until the student
   * chooses to move on, so the result does not flash past on the way.
   */
  function showFeedback(feedback, next) {
    pendingNext = next;

    for (const label of document.querySelectorAll(".choice")) {
      const radio = label.querySelector("input");
      radio.disabled = true;
      label.classList.add("graded");
      label.classList.remove("picked");

      const letter = label.querySelector(".choice-letter").textContent;
      const chosen = radio.checked;

      if (feedback.correct && chosen) {
        label.classList.add("is-correct");
        label.append(tag("Your answer"));
      } else if (!feedback.correct && chosen) {
        label.classList.add("is-wrong");
        label.append(tag("Your answer"));
      } else if (!feedback.correct && letter === feedback.correctLetter) {
        label.classList.add("is-correct");
        label.append(tag("Correct answer"));
      }
    }

    const box = $("feedback");
    box.textContent = "";
    box.hidden = false;
    box.className = "feedback " + (feedback.correct ? "yes" : "no");

    const verdict = document.createElement("strong");
    verdict.className = "verdict";
    verdict.textContent = feedback.correct ? "Correct" : "Incorrect";
    box.append(verdict);

    if (!feedback.correct && feedback.correctText) {
      box.append(document.createTextNode(
        `The correct answer is ${feedback.correctLetter}. ${feedback.correctText}`
      ));
    }
    if (feedback.explanation) {
      const why = document.createElement("span");
      why.className = "why";
      why.textContent = feedback.explanation;
      box.append(why);
    }

    const button = $("submit");
    button.disabled = false;
    button.textContent = next.finished ? "Finish" : "Next question";
    document.querySelector(".final-note").hidden = true;
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function tag(text) {
    const span = document.createElement("span");
    span.className = "tag";
    span.textContent = text;
    return span;
  }

  function showDone(score) {
    $("test").hidden = true;
    $("done").hidden = false;
    if (score && score.showToStudent) {
      $("score").textContent = score.percent + "%";
      $("score-detail").textContent = `${score.correct} of ${score.questions} correct`;
      $("score-block").hidden = false;
    }
  }

  function apply(data) {
    state = data;
    try { localStorage.setItem(STORE, data.token); } catch {}
    $("join").hidden = true;
    if (data.finished) showDone(data.score);
    else { $("test").hidden = false; showQuestion(); }
  }

  // --- submitting ----------------------------------------------------------
  //
  // The answer is not recorded until the server has it, and the next question
  // only arrives in that same reply. So a failed send must not advance
  // anything: we keep the student on this question, with their choice still
  // selected, and keep trying. If the device dies here the question is simply
  // unanswered, and they get it again when they log back in.

  async function submitAnswer() {
    if (picked == null || sending) return;
    sending = true;
    $("submit").disabled = true;
    $("submit").textContent = "Sending…";
    $("q-error").hidden = true;

    for (let attempt = 0; attempt < 4; attempt++) {
      try {
        const data = await post("/api/answer", {
          token: state.token,
          questionId: state.question.id,
          choiceId: picked,
        });
        setOffline(false);
        sending = false;
        if (data.feedback) showFeedback(data.feedback, data);
        else apply(data);
        return;
      } catch (err) {
        if (err.status && err.status < 500) {          // a refusal, not a dropout
          sending = false;
          $("q-error").textContent = err.message;
          $("q-error").hidden = false;
          $("submit").disabled = false;
          $("submit").textContent = "Submit answer";
          return;
        }
        setOffline(true);
        await new Promise((r) => setTimeout(r, 1000 * (attempt + 1)));
      }
    }

    sending = false;
    $("submit").disabled = false;
    $("submit").textContent = "Try again";
    $("q-error").textContent = "Could not reach the server. Your answer has not been saved yet.";
    $("q-error").hidden = false;
  }

  // The same button submits the answer, then moves on once the result is up.
  $("submit").addEventListener("click", () => {
    if (pendingNext) {
      const next = pendingNext;
      pendingNext = null;
      apply(next);
    } else {
      submitAnswer();
    }
  });

  // --- joining and resuming ------------------------------------------------

  $("join").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = event.target.querySelector("button");
    const error = $("join-error");
    error.hidden = true;
    button.disabled = true;
    button.textContent = "Starting…";
    try {
      apply(await post("/api/join", {
        code: $("code").value.trim().toUpperCase(),
        studentNumber: $("student").value.trim(),
      }));
    } catch (err) {
      error.textContent = err.message;
      error.hidden = false;
    } finally {
      button.disabled = false;
      button.textContent = "Start";
    }
  });

  // Log losing focus. Not lockdown -- a browser tab cannot be locked down --
  // but it is a signal worth having when a score looks surprising.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state?.token) {
      navigator.sendBeacon?.(
        "/api/event",
        new Blob([JSON.stringify({ token: state.token, kind: "focus_lost" })],
                 { type: "application/json" })
      );
    }
  });

  // A reload, or a new device, resumes on the question the server says they
  // reached. Nothing about the position is trusted to the browser.
  (async () => {
    let token = null;
    try { token = localStorage.getItem(STORE); } catch {}
    if (!token) return;
    try {
      apply(await post("/api/resume", { token }));
    } catch {
      try { localStorage.removeItem(STORE); } catch {}   // finished, closed, or stale
    }
  })();
})();
</script>
</body>
</html>
